<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft contact shadow under the white porcelain platter -->
    <radialGradient id="trayGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#431407" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#7c2d12" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0" />
    </radialGradient>

    <!-- Porcelain White Serving Tray gradients -->
    <linearGradient id="trayEdgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="trayInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Fries Carton (Deep Charcoal Slate) & Golden Fries -->
    <linearGradient id="slateCartonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fryGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="fryAltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Crisp White Drink Cup + Cool Mint-Teal Sleeve -->
    <linearGradient id="whiteCupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="tealSleeveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="38%" stop-color="#2dd4bf" />
      <stop offset="78%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <!-- Gourmet Honey-Brioche Burger -->
    <linearGradient id="bunTopGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#fcd34d" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bunBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="55%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#57260b" />
      <stop offset="55%" stop-color="#3b1806" />
      <stop offset="100%" stop-color="#271004" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="lettuceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="65%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Creamy Mozzarella Pizza Slice -->
    <linearGradient id="pizzaCrustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="pizzaCheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fefce8" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Crisp White & Cream-Gold Sparkle Accents -->
  <g opacity="0.95">
    <path d="M 118 44 Q 120 53 129 55 Q 120 57 118 66 Q 116 57 107 55 Q 116 53 118 44 Z" fill="#fef9c3" />
    <path d="M 314 38 Q 316 45 323 47 Q 316 49 314 56 Q 312 49 305 47 Q 312 45 314 38 Z" fill="#ffffff" />
    <circle cx="84" cy="80" r="3" fill="#ffffff" opacity="0.85" />
    <circle cx="338" cy="88" r="3.5" fill="#fef08a" opacity="0.9" />
    <!-- Fresh burst rays above burger -->
    <line x1="210" y1="68" x2="210" y2="48" stroke="#fef9c3" stroke-width="3" stroke-linecap="round" />
    <line x1="230" y1="73" x2="243" y2="57" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <line x1="190" y1="73" x2="177" y2="57" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Ground Contact Shadow -->
  <ellipse cx="210" cy="274" rx="172" ry="28" fill="url(#trayGroundShadow)" />

  <!-- ==============================================
       CRISP PORCELAIN WHITE SERVING PLATTER
       ============================================== -->
  <!-- Outer Beveled Tray Edge -->
  <ellipse cx="210" cy="256" rx="164" ry="29" fill="url(#trayEdgeGrad)" />
  <!-- Crisp White Top Rim -->
  <ellipse cx="210" cy="250" rx="162" ry="27" fill="#ffffff" />
  <!-- Recessed Porcelain Dish Surface -->
  <ellipse cx="210" cy="249" rx="146" ry="21" fill="url(#trayInnerGrad)" />
  <!-- Subtle Rim Highlight -->
  <path d="M 60 251 A 150 23 0 0 0 360 251" stroke="#ffffff" stroke-width="2" opacity="0.9" fill="none" />

  <!-- Soft Item Shadows on the White Tray -->
  <ellipse cx="111" cy="236" rx="32" ry="7" fill="#94a3b8" opacity="0.32" />
  <ellipse cx="308" cy="241" rx="33" ry="7" fill="#94a3b8" opacity="0.32" />
  <ellipse cx="212" cy="252" rx="58" ry="11" fill="#94a3b8" opacity="0.38" />
  <ellipse cx="120" cy="249" rx="34" ry="7" fill="#94a3b8" opacity="0.28" />

  <!-- ==============================================
       ITEM 1: CRISPY GOLDEN FRIES IN SLATE CARTON (Left)
       ============================================== -->
  <g transform="translate(58, 92)">
    <!-- Dark Slate Inner Back Pocket -->
    <path d="M 18 62 Q 53 50 88 62 L 84 72 Q 53 64 22 72 Z" fill="#0f172a" />

    <!-- Back Row Fries -->
    <rect x="23" y="8" width="9" height="64" rx="3" fill="url(#fryAltGrad)" transform="rotate(-14 27 40)" />
    <rect x="35" y="-2" width="9.5" height="72" rx="3" fill="url(#fryGoldGrad)" transform="rotate(-6 39 34)" />
    <rect x="48" y="-8" width="10" height="78" rx="3" fill="url(#fryAltGrad)" transform="rotate(2 53 32)" />
    <rect x="61" y="-3" width="9.5" height="73" rx="3" fill="url(#fryGoldGrad)" transform="rotate(10 65 34)" />
    <rect x="72" y="10" width="9" height="60" rx="3" fill="url(#fryAltGrad)" transform="rotate(17 76 40)" />

    <!-- Front Row Fries -->
    <rect x="29" y="22" width="8.5" height="52" rx="2.5" fill="#fef9c3" transform="rotate(-9 33 48)" />
    <rect x="42" y="14" width="9" height="58" rx="2.5" fill="url(#fryGoldGrad)" transform="rotate(0 46 43)" />
    <rect x="55" y="18" width="8.5" height="54" rx="2.5" fill="#fef9c3" transform="rotate(8 59 45)" />

    <!-- Deep Slate Carton Body -->
    <path d="M 16 60 L 28 142 Q 53 147 78 142 L 90 60 Q 53 75 16 60 Z" fill="url(#slateCartonGrad)" />
    <!-- Crisp White Top Trim Lip -->
    <path d="M 16 60 Q 53 75 90 60 L 89 66 Q 53 81 17 66 Z" fill="#f8fafc" />
    <!-- Subtle Vertical Carton Highlight -->
    <path d="M 28 70 L 35 138" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />

    <!-- Crisp White CanteenGo Cloche Emblem on Slate Carton -->
    <circle cx="53" cy="92" r="14" fill="#ffffff" />
    <path d="M 46 95 C 46 88.5 60 88.5 60 95 Z" fill="#ea580c" />
    <line x1="44" y1="96.5" x2="62" y2="96.5" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="53" cy="87" r="1.5" fill="#ea580c" />
  </g>

  <!-- ==============================================
       ITEM 2: CRISP WHITE CUP & MINT-TEAL SLEEVE (Right)
       ============================================== -->
  <g transform="translate(260, 96)">
    <!-- White & Mint-Teal Striped Straw (Continuous smooth joint) -->
    <path d="M 29 -17 L 40 -6 L 48 40" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 32 -14 L 40 -6 L 47 34" stroke="#0d9488" stroke-width="7.5" stroke-dasharray="7 8" stroke-linecap="butt" stroke-linejoin="round" fill="none" />

    <!-- Crisp White Cup Body -->
    <path d="M 18 42 L 26 140 Q 48 145 70 140 L 78 42 Q 48 47 18 42 Z" fill="url(#whiteCupGrad)" />

    <!-- Cool Mint-Teal Sleeve Wrap -->
    <path d="M 20 66 Q 48 72 76 66 L 72 117 Q 48 123 24 117 Z" fill="url(#tealSleeveGrad)" />
    <!-- Subtle Specular Highlight along Left Edge -->
    <path d="M 24 50 L 30 135" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round" />

    <!-- Crisp White Cup Lid -->
    <ellipse cx="48" cy="40" rx="36" ry="9" fill="#f1f5f9" />
    <ellipse cx="48" cy="36" rx="34" ry="8" fill="#ffffff" />
    <ellipse cx="48" cy="36" rx="26" ry="5" fill="#e2e8f0" opacity="0.6" />
    <rect x="13" y="38" width="70" height="4.5" rx="2.2" fill="#cbd5e1" opacity="0.85" />

    <!-- Crisp White Cloche Badge on Teal Sleeve -->
    <circle cx="48" cy="92" r="13" fill="#ffffff" />
    <path d="M 42 95 C 42 89 54 89 54 95 Z" fill="#0d9488" />
    <line x1="40" y1="96.5" x2="56" y2="96.5" stroke="#0d9488" stroke-width="1.6" stroke-linecap="round" />
    <circle cx="48" cy="88" r="1.3" fill="#0d9488" />
  </g>

  <!-- ==============================================
       ITEM 3: HONEY-BRIOCHE GOURMET BURGER (Center)
       ============================================== -->
  <g transform="translate(136, 120)">
    <!-- Toasted Bottom Bun -->
    <ellipse cx="74" cy="123" rx="54" ry="15" fill="url(#bunBottomGrad)" />
    <ellipse cx="74" cy="119" rx="52" ry="12" fill="#fbbf24" opacity="0.35" />

    <!-- Char-Grilled Patty -->
    <rect x="17" y="101" width="114" height="19" rx="9" fill="url(#pattyGrad)" />
    <!-- Subtle Seared Highlight -->
    <rect x="23" y="104" width="102" height="4" rx="2" fill="#7c2d12" opacity="0.65" />

    <!-- Melted Creamy Cheddar Cheese -->
    <path d="M 18 94 L 130 94 L 126 108 L 110 102 L 95 117 L 80 102 L 62 113 L 44 102 L 30 110 L 21 100 Z" fill="url(#cheeseGrad)" />

    <!-- Crisp Ruffled Emerald Lettuce -->
    <path d="M 13 89 Q 25 98 38 90 Q 51 83 64 92 Q 77 99 91 89 Q 105 83 118 91 Q 128 97 136 89 L 131 100 L 18 100 Z" fill="url(#lettuceGrad)" />
    <path d="M 19 92 Q 33 86 48 93 Q 63 87 77 94 Q 91 88 105 94 Q 119 87 131 93" stroke="#86efac" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.7" />

    <!-- Honey-Brioche Top Bun with Crisp Cream-White Rim Separation -->
    <path d="M 16 86 C 16 36, 132 36, 132 86 C 132 90, 16 90, 16 86 Z" fill="url(#bunTopGrad)" stroke="#fffbeb" stroke-width="1.6" stroke-opacity="0.85" />

    <!-- Soft Specular Gloss on Crown -->
    <ellipse cx="70" cy="54" rx="38" ry="12" fill="#ffffff" opacity="0.28" />

    <!-- Cream Sesame Seeds -->
    <g fill="#fffbeb" opacity="0.96">
      <ellipse cx="48" cy="58" rx="2.1" ry="3.6" transform="rotate(-25 48 58)" />
      <ellipse cx="67" cy="49" rx="2.1" ry="3.6" transform="rotate(8 67 49)" />
      <ellipse cx="88" cy="51" rx="2.1" ry="3.6" transform="rotate(28 88 51)" />
      <ellipse cx="104" cy="60" rx="2.1" ry="3.6" transform="rotate(42 104 60)" />
      <ellipse cx="38" cy="70" rx="2.1" ry="3.6" transform="rotate(-38 38 70)" />
      <ellipse cx="57" cy="66" rx="2.1" ry="3.6" transform="rotate(-6 57 66)" />
      <ellipse cx="78" cy="64" rx="2.1" ry="3.6" transform="rotate(14 78 64)" />
      <ellipse cx="97" cy="69" rx="2.1" ry="3.6" transform="rotate(34 97 69)" />
      <ellipse cx="47" cy="79" rx="2.1" ry="3.6" transform="rotate(-14 47 79)" />
      <ellipse cx="70" cy="77" rx="2.1" ry="3.6" transform="rotate(5 70 77)" />
      <ellipse cx="89" cy="78" rx="2.1" ry="3.6" transform="rotate(24 89 78)" />
      <ellipse cx="111" cy="75" rx="2.1" ry="3.6" transform="rotate(48 111 75)" />
    </g>
  </g>

  <!-- ==============================================
       ITEM 4: CHEESY HERB & OLIVE PIZZA SLICE (Front-Left)
       ============================================== -->
  <g transform="translate(74, 196) rotate(-10) scale(0.92)">
    <!-- Soft Drop Shadow onto White Tray -->
    <polygon points="10,70 64,12 72,68" fill="#64748b" opacity="0.22" />

    <!-- Golden Toasted Crust -->
    <path d="M 6 60 Q 38 74 72 66 L 76 56 Q 38 64 4 50 Z" fill="url(#pizzaCrustGrad)" />

    <!-- Creamy Melted Mozzarella Body -->
    <path d="M 5 54 L 62 6 Q 66 10 68 16 L 74 60 Q 40 68 5 54 Z" fill="url(#pizzaCheeseGrad)" stroke="#fefce8" stroke-width="1.2" />

    <!-- Melty Cheese Pull Highlight -->
    <path d="M 60 11 Q 48 34 36 49 Q 22 54 8 54" stroke="#ffffff" stroke-width="2" opacity="0.65" stroke-linecap="round" fill="none" />

    <!-- Crisp Black Olive Rings (High-Contrast, Zero Red Clash) -->
    <g>
      <circle cx="34" cy="43" r="6.8" fill="#1e293b" />
      <circle cx="34" cy="43" r="3" fill="#fef08a" />

      <circle cx="55" cy="45" r="6.2" fill="#1e293b" />
      <circle cx="55" cy="45" r="2.7" fill="#fef08a" />

      <circle cx="48" cy="24" r="5.6" fill="#1e293b" />
      <circle cx="48" cy="24" r="2.4" fill="#fef08a" />
    </g>

    <!-- Fresh Green Basil Leaves & Sweet Corn / Herb Garnish -->
    <ellipse cx="44" cy="36" rx="5.5" ry="3" fill="#22c55e" transform="rotate(-28 44 36)" />
    <ellipse cx="26" cy="49" rx="4.5" ry="2.5" fill="#16a34a" transform="rotate(22 26 49)" />
    <ellipse cx="61" cy="34" rx="4.5" ry="2.4" fill="#22c55e" transform="rotate(40 61 34)" />
    <circle cx="40" cy="52" r="2.2" fill="#f59e0b" />
    <circle cx="56" cy="54" r="2" fill="#f59e0b" />
  </g>
</svg>
